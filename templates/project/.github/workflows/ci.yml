name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
<!--#if full-->
  # Ověří, že root .cursor/ je v souladu se zdroji ve vrstvách.
  agent-config:
    name: Agent config in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ověř soulad root .cursor se zdroji ve vrstvách
<!--#if tooling_pwsh-->
        shell: pwsh
        run: ./scripts/sync-agent-config.ps1 -Check
<!--#endif-->
<!--#if tooling_node-->
        run: node scripts/sync-agent-config.mjs --check
<!--#endif-->

<!--#endif-->
  # Dynamicky objeví vrstvy, aby nová vrstva nevyžadovala ruční úpravu CI.
  discover-layers:
    name: Discover layers
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.list.outputs.layers }}
    steps:
      - uses: actions/checkout@v4

      - name: Sestav seznam vrstev
        id: list
<!--#if tooling_pwsh-->
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $layers = @(
            Get-ChildItem -Directory src |
              Where-Object { Test-Path (Join-Path $_.FullName 'AGENTS.md') } |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          if ($layers.Count -eq 0) { throw 'Nenalezena žádná vrstva v src/.' }
          $json = ConvertTo-Json -InputObject ([string[]]$layers) -Compress
          Write-Host "Nalezené vrstvy: $json"
          "layers=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
<!--#endif-->
<!--#if tooling_node-->
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t layers < <(
            find src -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
              [ -f "$dir/AGENTS.md" ] && basename "$dir"
            done | sort
          )
          if [ "${#layers[@]}" -eq 0 ]; then
            echo 'Nenalezena žádná vrstva v src/.' >&2
            exit 1
          fi
          json=$(printf '%s\n' "${layers[@]}" | jq -R . | jq -sc .)
          echo "Nalezené vrstvy: $json"
          echo "layers=$json" >> "$GITHUB_OUTPUT"
<!--#endif-->

  # Každá vrstva se ověří a otestuje samostatně a paralelně.
  layers:
    name: Layer ${{ matrix.layer }}
    needs: discover-layers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJson(needs.discover-layers.outputs.layers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Ověř strukturu a konfiguraci vrstvy
<!--#if tooling_pwsh-->
        shell: pwsh
        run: ./scripts/verify-layer.ps1 -Layer ${{ matrix.layer }}
<!--#endif-->
<!--#if tooling_node-->
        run: node scripts/verify-layer.mjs --layer ${{ matrix.layer }}
<!--#endif-->

      - name: Testy vrstvy
<!--#if tooling_pwsh-->
        shell: pwsh
        run: ./scripts/test-layer.ps1 -Layer ${{ matrix.layer }}
<!--#endif-->
<!--#if tooling_node-->
        run: node scripts/test-layer.mjs --layer ${{ matrix.layer }}
<!--#endif-->
