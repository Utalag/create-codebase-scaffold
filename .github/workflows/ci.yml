name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Testy generátoru: presety, názvy, render a end-to-end generování.
  test:
    name: Testy generátoru (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Spusť testy
        run: npm test

  # Ověří, že vygenerovaný projekt projde vlastními kontrolami v obou toolinzích.
  generated-project:
    name: Vygenerovaný projekt (node i pwsh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vygeneruj a ověř projekt s node toolingem
        run: |
          set -euo pipefail
          node bin/create.js "$RUNNER_TEMP/app-node" \
            --preset clean --tooling node --machinery full --agents all --yes
          cd "$RUNNER_TEMP/app-node"
          node scripts/sync-agent-config.mjs
          node scripts/sync-agent-config.mjs --check
          node scripts/verify-layer.mjs --layer Domain
          node scripts/test-layer.mjs --layer Domain
          node scripts/new-layer.mjs --name Adapters
          node scripts/sync-agent-config.mjs
          node scripts/sync-agent-config.mjs --check

      - name: Vygeneruj a ověř projekt s pwsh toolingem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node bin/create.js "$env:RUNNER_TEMP/app-pwsh" `
            --preset layered --tooling pwsh --machinery full --agents all --yes
          Set-Location "$env:RUNNER_TEMP/app-pwsh"
          pwsh -File scripts/sync-agent-config.ps1
          pwsh -File scripts/sync-agent-config.ps1 -Check
          pwsh -File scripts/verify-layer.ps1 -Layer Business
          pwsh -File scripts/test-layer.ps1 -Layer Business
          pwsh -File scripts/new-layer.ps1 -Name Adapters
          pwsh -File scripts/sync-agent-config.ps1
          pwsh -File scripts/sync-agent-config.ps1 -Check

      - name: Vygeneruj odlehčenou variantu bez zrcadla
        run: |
          set -euo pipefail
          node bin/create.js "$RUNNER_TEMP/app-lean" \
            --preset vertical-slice --tooling node --machinery lean --agents cursor,copilot --yes
          cd "$RUNNER_TEMP/app-lean"
          test ! -f scripts/sync-agent-config.mjs
          test ! -d src/Features/.cursor
          node scripts/verify-layer.mjs --layer Features
